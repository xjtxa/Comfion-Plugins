name: Assemble verified plugin upload
on: workflow_dispatch
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: xjtxa/Comfion-Plugins
    steps:
      - name: Reassemble byte-identical package
        shell: bash
        run: |
          set -euo pipefail
          gh release download plugins-2026.09.14 --pattern 'openhands-upload.part*' --dir parts
          cat parts/openhands-upload.part* > searxng_search-1.3.0.zip
          echo '4157f1ad8125723d5c3e7a5ea1bb3d5d8873d676dba8fe41beb622b07ae6ec3c  searxng_search-1.3.0.zip' | sha256sum --check
          gh release upload plugins-2026.09.14 searxng_search-1.3.0.zip --clobber
          for file in parts/*; do
            gh release delete-asset plugins-2026.09.14 "$(basename "$file")" --yes
          done
